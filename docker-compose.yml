services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pixelcrm_shineray_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=shineray-crm-production-jwt-secret-key-2025
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://127.0.0.1,http://127.0.0.1:80
    volumes:
      # Persistência das credenciais de autenticação Baileys WhatsApp
      - shineray_baileys_auth:/app/baileys_auth_info
      # Persistência do banco de dados relacional SQLite
      - shineray_prisma_data:/app/prisma
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pixelcrm_shineray_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  shineray_baileys_auth:
    driver: local
  shineray_prisma_data:
    driver: local
